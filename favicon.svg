<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#11263a"/>
  <!-- Sun half-risen above horizon -->
  <clipPath id="c">
    <rect x="0" y="0" width="32" height="21"/>
  </clipPath>
  <circle cx="16" cy="21" r="7.5" fill="#cf9d47" clip-path="url(#c)"/>
  <!-- Horizon line -->
  <line x1="2" y1="21" x2="30" y2="21" stroke="#cf9d47" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Rays -->
  <g stroke="#cf9d47" stroke-width="1.1" stroke-linecap="round" opacity="0.75">
    <line x1="16" y1="5"   x2="16" y2="7.5"/>
    <line x1="21.8" y1="7" x2="20.4" y2="9"/>
    <line x1="10.2" y1="7" x2="11.6" y2="9"/>
    <line x1="25"   y1="13" x2="22.8" y2="14"/>
    <line x1="7"    y1="13" x2="9.2"  y2="14"/>
    <line x1="26.5" y1="18.5" x2="24" y2="18.8"/>
    <line x1="5.5"  y1="18.5" x2="8"  y2="18.8"/>
  </g>
</svg>
